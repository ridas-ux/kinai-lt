name: Atnaujinti repertuarą

on:
  schedule:
    - cron: "0 3 * * *"    # kasdien ~06:00 Vilniaus laiku (žiemą 05:00)
    - cron: "0 12 * * *"   # dar kartą ~15:00 – pasikeitusiems seansams
  workflow_dispatch:        # rankinis paleidimas: Actions → Run workflow
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Surinkti repertuarą
        run: node scripts/scrape.mjs

      - name: Sugeneruoti filmų puslapius
        run: node scripts/pages.mjs

      - name: Žiūrėti namuose (Netflix, Go3, LRT Epika, Apple TV + IMDb/RT)
        run: node scripts/streaming.mjs
        continue-on-error: true
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}

      - name: Išsaugoti data.json saugykloje
        run: |
          git config user.name "kinas-bot"
          git config user.email "kinas-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q origin/main
            git add site/data.json site/streaming.json
            if git diff --cached --quiet; then echo "Nėra pakeitimų"; break; fi
            git commit -q -m "Repertuaras $(date -u +%F\ %H:%M)"
            if git push -q origin HEAD:main; then echo "Išsaugota"; break; fi
            sleep $((i*5))
          done

      - name: Naršyklės talpyklos apėjimas (app.js, style.css ir kt. su versija)
        run: |
          v=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i -E "s#(src|href)=\"(app\.js|auth\.js|firebase-config\.js|style\.css)\"#\1=\"\2?v=$v\"#g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
